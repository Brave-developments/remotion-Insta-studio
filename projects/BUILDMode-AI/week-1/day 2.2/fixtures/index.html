<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BUILDMode / Original development fixtures</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#07090d;color:#f8fafc}*{box-sizing:border-box}body{margin:0}header{padding:24px 30px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{letter-spacing:2px}nav{display:flex;flex-wrap:wrap;gap:8px}button,input,select{font:inherit;border:1px solid #334155;border-radius:8px;background:#101720;color:inherit;padding:10px 14px}button{cursor:pointer}button:hover,button:focus-visible{border-color:#60a5fa}button.active,.primary{background:#2563eb}main{max-width:1280px;margin:40px auto;padding:0 30px}h1{font-size:42px;letter-spacing:-1px;margin-bottom:10px}.muted{color:#94a3b8}.panel{background:#101720;border:1px solid #334155;border-radius:14px;padding:24px;margin:24px 0}.row{display:flex;gap:20px}.metric{flex:1;padding:20px;border:1px solid #334155;border-radius:10px}.metric strong{display:block;font-size:38px;margin-top:12px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.column{padding:20px;border:1px solid #334155;background:#0c121b;min-height:330px;border-radius:13px}.column h2{font-size:20px}.card{background:#182331;border:1px solid #475569;border-radius:9px;padding:14px;margin:12px 0;display:flex;justify-content:space-between;gap:15px;cursor:grab}.card button{padding:0 7px;color:#fda4af}.files{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.file{padding:15px;border:1px solid #334155;border-radius:9px}.file strong{display:block;color:#60a5fa;margin:10px 0}textarea{width:100%;height:160px;background:#070d15;color:#d9e2ed;border:1px solid #334155;font:15px monospace;padding:15px;border-radius:9px}canvas{background:#050911;border:1px solid #334155;display:block;max-width:100%;margin:20px auto}.notice{background:#111b2b;border-left:3px solid #60a5fa;padding:15px;line-height:1.6}.hidden{display:none}.landing{padding:40px;background:#09111d;border-radius:10px}.landing h2{font-size:60px;line-height:1.05;max-width:700px}.ugly{background:#fdf4c5;color:#5a1476;font-family:Georgia;box-shadow:8px 8px #eb93ce;border-radius:0}.ugly h2{font-size:42px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap;color:#94a3b8}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.board{grid-template-columns:1fr}.files{grid-template-columns:repeat(2,1fr)}.row{flex-direction:column}.landing h2{font-size:42px}}
</style>
<header><strong>BUILDMode / FIXTURES</strong><nav id="nav"></nav></header><main><div class="notice">Original functional development fixtures. These are local builds, not screenshots of third-party products and not evidence that external AI tools completed an experiment. Audio remains deferred.</div><div id="app"></div></main>
<script>
const app=document.querySelector('#app'),nav=document.querySelector('#nav');let stopGame=()=>{};
const modes=['Dashboard','Kanban','Redesign','Dodge game','CSV export','Rename preview'];
modes.forEach(mode=>{let b=document.createElement('button');b.textContent=mode;b.onclick=()=>show(mode);nav.append(b)});
function show(mode){stopGame();nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.textContent===mode));({Dashboard:dashboard,Kanban:kanban,Redesign:redesign,'Dodge game':game,'CSV export':csv,'Rename preview':rename})[mode]();}
function dashboard(){app.innerHTML=`<h1>NORTH / Business dashboard</h1><p class="muted">Original screenshot-to-interface reference. All chart and revenue values below are synthetic sample data.</p><section class="panel"><div class="row"><div class="metric">Monthly revenue<strong>$24,680</strong></div><div class="metric">Active projects<strong>18</strong></div><div class="metric">Completed milestones<strong>42</strong></div></div><svg viewBox="0 0 1000 250" width="100%" height="250"><path d="M0 200H1000M0 150H1000M0 100H1000M0 50H1000" stroke="#334155"/><path d="M0 185L125 160L245 170L370 90L500 118L625 60L755 84L875 33L1000 45" fill="none" stroke="#60a5fa" stroke-width="4"/></svg><button id="create" class="primary">Create project</button><div id="projects"></div></section>`;let count=0;document.querySelector('#create').onclick=()=>{count++;document.querySelector('#projects').textContent=`New local project ${count} created. This button has a genuine handler.`}}
function kanban(){let cards;try{cards=JSON.parse(localStorage.getItem('buildmode-board'))}catch{}if(!Array.isArray(cards))cards=[{id:'seed-1',title:'Write launch copy',column:'To do'},{id:'seed-2',title:'Capture demo',column:'Doing'},{id:'seed-3',title:'Create board',column:'Done'}];function save(){localStorage.setItem('buildmode-board',JSON.stringify(cards));draw()}function draw(){app.innerHTML=`<h1>Local Kanban</h1><p class="muted">Add, delete, move and persist cards. Drag with a mouse, or use the column selector for keyboard access.</p><form id="add" class="controls"><input id="title" aria-label="New card title" placeholder="New card title" required maxlength="100"><button class="primary">Add card</button></form><div class="board panel" id="board"></div>`;['To do','Doing','Done'].forEach(column=>{let el=document.createElement('section');el.className='column';let h=document.createElement('h2');h.textContent=column;el.append(h);el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let card=cards.find(c=>c.id===e.dataTransfer.getData('text/plain'));if(card){card.column=column;save()}};cards.filter(c=>c.column===column).forEach(card=>{let c=document.createElement('div');c.className='card';c.draggable=true;c.ondragstart=e=>e.dataTransfer.setData('text/plain',card.id);let content=document.createElement('div');let label=document.createElement('div');label.textContent=card.title;content.append(label);let select=document.createElement('select');select.setAttribute('aria-label',`Move ${card.title}`);['To do','Doing','Done'].forEach(v=>{let o=new Option(v,v,v===column,v===column);select.add(o)});select.onchange=()=>{card.column=select.value;save()};content.append(select);let del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label',`Delete ${card.title}`);del.onclick=()=>{cards=cards.filter(x=>x.id!==card.id);save()};c.append(content,del);el.append(c)});document.querySelector('#board').append(el)});document.querySelector('#add').onsubmit=e=>{e.preventDefault();let title=document.querySelector('#title').value.trim();if(title){cards.push({id:crypto.randomUUID(),title,column:'To do'});save()}}}draw()}
function redesign(){app.innerHTML=`<h1>Same content / Different hierarchy</h1><p class="muted">Original baseline and redesign. The toggle changes styling while signup, FAQ and navigation remain functional.</p><div class="controls"><button id="toggle">Show deliberately ugly baseline</button><a href="#signup">Jump to signup</a></div><section class="panel landing" id="landing"><p>FIELDNOTE /</p><h2>Less admin.<br>More room to create.</h2><p>A focused workspace for your next idea.</p><form id="signup" class="controls"><input type="email" aria-label="Email address" placeholder="Your email" required><button class="primary">Join the waitlist</button></form><p id="signup-status" role="status"></p><details><summary>Does this require a backend?</summary><p>This local fixture only validates an email and displays a confirmation. It does not submit personal data.</p></details></section>`;document.querySelector('#toggle').onclick=e=>{let ugly=document.querySelector('#landing').classList.toggle('ugly');e.target.textContent=ugly?'Show original redesign':'Show deliberately ugly baseline'};document.querySelector('#signup').onsubmit=e=>{e.preventDefault();document.querySelector('#signup-status').textContent='Email format accepted locally. Nothing was sent.'}}
function game(){app.innerHTML=`<h1>Endless dodge / Playable fixture</h1><p class="muted">Left and right arrows or A/D to move. Collision ends the run. R or Restart begins a fresh run. Best score persists locally.</p><div class="controls"><button id="restart" class="primary">Restart</button><span id="score"></span></div><canvas id="game" width="700" height="550" tabindex="0" aria-label="Dodge game. Use left and right arrows to move. Press R to restart."></canvas>`;const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),keys=new Set();let score=0,best=Number(localStorage.getItem('buildmode-dodge-best')||0),ended=false,last=performance.now(),spawn=0,obstacles=[],p={x:330,y:480,w:35,h:35},running=true;function reset(){score=0;ended=false;spawn=0;obstacles=[];p.x=330;canvas.focus()}document.querySelector('#restart').onclick=reset;function down(e){if(['ArrowLeft','ArrowRight','a','d','r','R'].includes(e.key)){e.preventDefault();keys.add(e.key);if(e.key.toLowerCase()==='r')reset()}}function up(e){keys.delete(e.key)}window.addEventListener('keydown',down);window.addEventListener('keyup',up);function tick(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000);last=now;if(!ended){score+=dt;let speed=260;if(keys.has('ArrowLeft')||keys.has('a'))p.x-=speed*dt;if(keys.has('ArrowRight')||keys.has('d'))p.x+=speed*dt;p.x=Math.max(0,Math.min(665,p.x));spawn-=dt;if(spawn<=0){obstacles.push({x:Math.random()*660,y:-40,w:40,h:40});spawn=Math.max(.22,.8-score*.01)}for(let o of obstacles){o.y+=(150+score*4)*dt;if(p.x<o.x+o.w&&p.x+p.w>o.x&&p.y<o.y+o.h&&p.y+p.h>o.y){ended=true;best=Math.max(best,Math.floor(score));localStorage.setItem('buildmode-dodge-best',String(best))}}obstacles=obstacles.filter(o=>o.y<600)}ctx.clearRect(0,0,700,550);ctx.strokeStyle='#1e293b';for(let x=0;x<700;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,550);ctx.stroke()}ctx.fillStyle='#fda4af';obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));ctx.fillStyle='#60a5fa';ctx.fillRect(p.x,p.y,p.w,p.h);if(ended){ctx.fillStyle='#f8fafc';ctx.font='bold 38px system-ui';ctx.fillText('Run ended — R to restart',110,260)}document.querySelector('#score').textContent=`Score ${Math.floor(score)} / Best ${best}`;requestAnimationFrame(tick)}requestAnimationFrame(tick);canvas.focus();stopGame=()=>{running=false;window.removeEventListener('keydown',down);window.removeEventListener('keyup',up)}}
function csv(){const records=[{name:'Ada',note:'comma, inside'},{name:'Grace',note:'quote " inside'},{name:'Renée',note:'two\nlines'},{name:'Lin',note:''}];function cell(v){let s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}const output=[['name','note'],...records.map(r=>[r.name,r.note])].map(row=>row.map(cell).join(',')).join('\r\n');app.innerHTML=`<h1>CSV export / Edge-case fixture</h1><p class="muted">Original data includes commas, double quotes, Unicode, embedded newlines and an empty field.</p><section class="panel"><textarea id="csv" readonly aria-label="CSV preview"></textarea><button id="download" class="primary">Download valid CSV</button></section>`;document.querySelector('#csv').value=output;document.querySelector('#download').onclick=()=>{let url=URL.createObjectURL(new Blob([output],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='edge-cases.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function rename(){let files=Array.from({length:20},(_,i)=>({name:`IMG_${4830+i}.png`,category:['code','design','receipt','chat','game','other'][i%6]}));let applied=false;app.innerHTML=`<h1>Screenshot cleaner / Safe rename preview</h1><p class="muted">Synthetic file metadata. Categories are preassigned for fixture testing; no AI classifier is being claimed. No disk files are touched.</p><section class="panel"><div class="files" id="files"></div><div class="controls" style="margin-top:24px"><button id="apply" class="primary">Apply proposed names to preview</button><button id="rollback">Rollback preview</button><button id="mapping">Download rollback mapping</button></div></section>`;const counts={};let mapping=files.map(f=>{let n=(counts[f.category]||0)+1;counts[f.category]=n;return {from:f.name,to:`${f.category}-${String(n).padStart(2,'0')}.png`,category:f.category}});function draw(){document.querySelector('#files').replaceChildren();mapping.forEach(f=>{let div=document.createElement('div');div.className='file';let title=document.createElement('strong');title.textContent=f.category.toUpperCase();let label=document.createElement('span');label.textContent=applied?f.to:f.from;div.append(title,label);document.querySelector('#files').append(div)})}document.querySelector('#apply').onclick=()=>{applied=true;draw()};document.querySelector('#rollback').onclick=()=>{applied=false;draw()};document.querySelector('#mapping').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(mapping,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='rollback-map.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw()}
show('Dashboard');
</script></html>
