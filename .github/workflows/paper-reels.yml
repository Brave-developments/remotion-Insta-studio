name: Paper Reels Checks
on:
  pull_request:
    paths:
      - 'src/paper/**'
      - 'scripts/paper-media.mjs'
      - 'tests/paper-media.test.mjs'
      - 'content/paper/**'
      - 'src/Root.tsx'
      - 'package.json'
      - '.github/workflows/paper-reels.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run paper:test
      - run: npm run typecheck
