name: Paper Reels Checks
on:
  pull_request:
    paths:
      - 'src/paper/**'
      - 'scripts/paper-media.mjs'
      - 'tests/paper-media.test.mjs'
      - 'content/paper/**'
      - 'src/Root.tsx'
      - 'package.json'
      - '.github/workflows/paper-reels.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run paper:test
      - run: npm run typecheck
      - name: Fetch real Wikimedia Commons photographs
        run: npm run paper:prepare
      - name: Render actual paper frame in Remotion Chromium
        run: npx remotion still PaperReel out/paper-smoke.png --frame=120
      - name: Render complete example MP4
        run: npx remotion render PaperReel out/paper-example.mp4 --codec=h264 --concurrency=2
      - name: Save preview and source credits
        uses: actions/upload-artifact@v4
        with:
          name: paper-reel-demo
          path: |
            out/paper-smoke.png
            out/paper-example.mp4
            content/paper/credits.json
          retention-days: 7
